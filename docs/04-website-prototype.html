<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alchemist Detailing</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--bg:#070605;--p:#13100c;--p2:#1c1710;--ln:rgba(212,175,90,.24);--g:#d4af5a;--g2:#f3dc9a;--ink:#f4efe4;--mu:#a69d8b;--bad:#e8806a;
--fd:"Cormorant Garamond",Georgia,serif;--fb:Outfit,system-ui,sans-serif;
--gold:linear-gradient(110deg,#8c6a21,#d4af5a 30%,#f6e3a1 50%,#d4af5a 70%,#8c6a21)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--fb)}
h1,h2,h3{font-family:var(--fd);font-weight:600;margin:0;line-height:1.05}
h2{font-size:34px;margin-bottom:4px}h3{font-size:25px;margin:30px 0 8px}
p{margin:0 0 12px}.mu{color:var(--mu)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--g2);outline-offset:2px}
nav{position:fixed;top:0;left:0;right:0;z-index:30;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;max-width:1100px;margin:auto;height:58px;padding:0 8px;border:1px solid var(--ln);border-radius:16px;background:rgba(12,10,8,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 30px rgba(0,0,0,.45)}
.mb{justify-self:start;width:42px;height:42px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--ln);background:linear-gradient(#2a2216,#0f0c08);box-shadow:inset 0 1px 0 rgba(255,235,170,.28),inset 0 -2px 5px rgba(0,0,0,.6);color:var(--g);cursor:pointer}
#pg{font:600 21px var(--fd);letter-spacing:.04em}
.rt{justify-self:end;display:flex;align-items:center;gap:6px}
.ib{background:none;border:0;padding:6px;color:var(--g);cursor:pointer;display:grid;place-items:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .35s;z-index:40}
.ov.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;left:0;bottom:0;width:min(100%,max(33vw,380px));z-index:50;background:rgba(14,11,8,.93);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-right:1px solid var(--ln);transform:translateX(-102%);transition:transform .45s cubic-bezier(.2,.8,.2,1);padding:calc(22px + env(safe-area-inset-top,0px)) 28px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow-y:auto}
aside.on{transform:none}
aside .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
aside a.l{font:500 30px var(--fd);color:var(--ink);text-decoration:none;padding:7px 0;border-bottom:1px solid rgba(212,175,90,.1);opacity:0;transform:translateX(-16px);transition:opacity .4s,transform .4s,color .2s;transition-delay:calc(var(--i)*45ms + 140ms),calc(var(--i)*45ms + 140ms),0s}
aside.on a.l{opacity:1;transform:none}aside a.l:hover{color:var(--g2)}
aside .btn{margin-top:22px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:12px;border:1px solid var(--g);background:#0b0907;color:var(--g);font:600 14px var(--fb);letter-spacing:.09em;cursor:pointer;text-decoration:none;text-transform:uppercase}
.btn.sm{min-height:38px;padding:0 16px;font-size:12px}
.gold{background:var(--gold);color:#120d04;border-color:transparent;box-shadow:0 0 26px rgba(212,175,90,.3)}
.gold::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);transform:translateX(-120%);animation:sh 3.4s ease-in-out infinite}
@keyframes sh{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.hero{position:relative;overflow:hidden;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:100px 22px 54px;background:var(--sc),var(--bg);background-size:cover;background-position:center}
.hero::after{content:"";position:absolute;top:-20%;bottom:-20%;width:30%;left:-40%;background:linear-gradient(100deg,transparent,rgba(243,220,154,.24),transparent);transform:skewX(-18deg);animation:hs 4.5s .5s ease-out forwards;pointer-events:none}
@keyframes hs{to{left:130%}}
.hero>*{position:relative;z-index:1;max-width:760px}
.hero h1{font-size:clamp(44px,10vw,92px);margin:18px 0 14px}
.hero p{font-size:18px;color:#d9d1bf;max-width:30em}
.wrap{max-width:760px;margin:auto;padding:104px 20px 60px}
.sec{max-width:760px;margin:auto;padding:54px 20px 0}
.row{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid rgba(212,175,90,.14)}
.row p{color:var(--mu);margin:2px 0 0;font-size:14px}.rp{display:flex;align-items:center;gap:12px;font:600 20px var(--fd);white-space:nowrap}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.ph{aspect-ratio:3/4;border:1px dashed var(--ln);border-radius:14px;display:grid;place-items:center;text-align:center;color:var(--mu);font-size:13px;padding:8px}
.cta{text-align:center;padding:70px 20px 40px}.cta h2{font-size:clamp(30px,7vw,48px);margin-bottom:18px}
footer{text-align:center;color:var(--mu);font-size:13px;padding:20px 20px calc(30px + env(safe-area-inset-bottom,0px))}
.prog{height:3px;background:rgba(212,175,90,.15);border-radius:3px;margin-bottom:18px}.prog i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .4s}
.f{margin:14px 0}.f label{display:block;font-size:14px;color:var(--mu);margin-bottom:6px}
input,select,textarea{width:100%;background:#0d0b08;color:var(--ink);border:1px solid var(--ln);border-radius:12px;padding:13px 14px;font:inherit}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--g);outline:0;box-shadow:0 0 0 3px rgba(212,175,90,.18)}
.e{color:var(--bad);font-size:13px;display:block;margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--ln);background:#0d0b08;border-radius:999px;padding:9px 15px;cursor:pointer;font-size:14px}
.chip[aria-pressed=true],.opt[aria-pressed=true]{border-color:var(--g);background:rgba(212,175,90,.14);box-shadow:0 0 16px rgba(212,175,90,.22)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--ln);background:linear-gradient(var(--p2),var(--p));border-radius:14px;padding:14px 16px;margin:10px 0;cursor:pointer}
.opt b{display:flex;justify-content:space-between;font-family:var(--fd);font-size:21px}
.opt span{color:var(--mu);font-size:14px}
.opt.bun{border-color:rgba(212,175,90,.5);background:radial-gradient(120% 140% at 100% 0,rgba(212,175,90,.2),transparent 55%),linear-gradient(var(--p2),var(--p));padding:18px}
.sv{color:var(--g2);font-size:14px}.old{text-decoration:line-through;color:var(--mu);margin-right:8px;font-size:16px}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs .chip{flex:1;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.loc{min-height:96px;border:1px solid var(--ln);border-radius:16px;background:linear-gradient(var(--p2),var(--p));cursor:pointer;font:600 15px var(--fb);letter-spacing:.06em;text-transform:uppercase;position:relative;overflow:hidden;padding:10px;isolation:isolate}
.loc[aria-pressed=true]{border-color:var(--g);color:var(--g2)}
.foam::before{content:"";position:absolute;inset:-8px;background:radial-gradient(circle at 12% 70%,#fff8 0 9px,transparent 10px),radial-gradient(circle at 30% 30%,#fff7 0 13px,transparent 14px),radial-gradient(circle at 55% 78%,#fff8 0 11px,transparent 12px),radial-gradient(circle at 75% 25%,#fff7 0 9px,transparent 10px),radial-gradient(circle at 90% 65%,#fff8 0 14px,transparent 15px);animation:fm .7s ease-out both;pointer-events:none;z-index:-1}
@keyframes fm{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:.55}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal small{text-align:center;color:var(--mu);font-size:12px}
.day{aspect-ratio:1;border:1px solid var(--ln);background:#0d0b08;border-radius:10px;cursor:pointer;font-size:15px;line-height:1.1;padding:0}
.day em{display:block;font:normal 9px var(--fb);color:var(--g)}
.day.full{background:repeating-linear-gradient(45deg,rgba(212,175,90,.3) 0 4px,transparent 4px 8px);color:var(--g2);cursor:not-allowed}
.day.on{background:var(--gold);color:#120d04;border-color:transparent;font-weight:600}.day.on em{color:#120d04}
.tm{border:1px solid var(--ln);background:#0d0b08;border-radius:10px;padding:11px 0;cursor:pointer;font-size:14px}
.tm:disabled{opacity:.3;text-decoration:line-through;cursor:not-allowed}.tm.on{background:var(--gold);color:#120d04;border-color:transparent;font-weight:600}
.sum{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;padding:14px 0;border-bottom:1px solid rgba(212,175,90,.14)}
.sum dt{color:var(--mu)}.sum dd{margin:0;text-align:right}
.tot{display:flex;justify-content:space-between;font:600 26px var(--fd);padding:14px 0}
.acts{display:flex;justify-content:space-between;gap:12px;margin-top:30px}
.note{font-size:13px;color:var(--mu);margin-top:10px}
.lk{background:none;border:0;color:var(--g);cursor:pointer;text-decoration:underline;font-size:13px}
.acts{position:sticky;bottom:0;z-index:5;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%)}
input,select,textarea{scroll-margin-bottom:150px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:12px}.leg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px;border:1px solid var(--ln)}
.box{border:1px solid var(--ln);border-radius:14px;padding:14px 16px;background:linear-gradient(var(--p2),var(--p));margin:14px 0}.box b{font:600 24px var(--fd);display:block}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--ln)}
.pv{position:fixed;top:calc(80px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:25;background:rgba(0,0,0,.78);border:1px solid var(--ln);color:var(--mu);font-size:11px;padding:5px 12px;border-radius:999px;cursor:pointer}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.opt.bun{min-height:132px;padding:22px 20px;background:radial-gradient(120% 140% at 100% 0,rgba(246,227,161,.22),transparent 55%),radial-gradient(90% 90% at 0 100%,rgba(140,106,33,.25),transparent 60%),linear-gradient(var(--p2),var(--p))}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head>
<body>
<nav><div class="bar">
<button class="mb" id="mb" data-a="menu" aria-label="Open menu" aria-expanded="false"><svg width="20" height="14" viewBox="0 0 20 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1h18M1 7h12M1 13h18"/></svg></button>
<div id="pg">Home</div>
<div class="rt"><a class="ib" href="#home" aria-label="Alchemist Detailing home" id="lg1"></a><a class="ib" href="#account" aria-label="Account"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4-6.5 8-6.5s7 2 8 6.5"/></svg></a></div>
</div></nav>
<div class="ov" id="ov" data-a="close"></div>
<aside id="sd" aria-label="Menu"><div class="top"><span id="lg2"></span><button class="ib" data-a="close" aria-label="Close menu"><svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div><div id="ml" style="display:flex;flex-direction:column"></div><a class="btn gold" href="#book">Book now</a></aside>
<div id="v"></div>
<script>
/* ---- Easy edit zone: swap in real assets and final business details ---- */
const LOGO_SRC='';                       // e.g. 'logo.png' once you upload it
const HERO=[                              // add {img:'photos/hero1.jpg'} entries; one is picked per page load
{bg:'radial-gradient(110% 70% at 85% 15%,rgba(212,175,90,.38),transparent 60%),linear-gradient(180deg,#120d07,#070605)'},
{bg:'radial-gradient(100% 70% at 10% 25%,rgba(212,175,90,.34),transparent 60%),linear-gradient(200deg,#15100a,#070605)'},
{bg:'radial-gradient(90% 60% at 50% 0,rgba(246,227,161,.3),transparent 62%),linear-gradient(180deg,#0e0b07,#070605)'},
{bg:'radial-gradient(110% 60% at 90% 90%,rgba(212,175,90,.32),transparent 60%),linear-gradient(160deg,#130e08,#070605)'}];
const CFG={OPEN:10,CLOSE:19,STEP:30};   // CLOSE = hour every job must be finished by (assumption: 7 PM)
const EXT=[['Level 1',30,60,'Basic exterior wash'],['Level 2',65,90,'Pre-wash, brake and wheel cleaning'],['Level 3',100,150,'Three-step exterior wash, brake cleaner, tire glaze'],['Level 4',160,210,'Four-step wash with a ceramic-like finish, brake cleaner, tire glaze']];
const INT=[['Level 1',40,60,'Basic interior cleaning'],['Level 2',85,120,'Deeper interior cleaning'],['Level 3',130,180,'Stain removal, steaming, carpet cleaning'],['Level 4',190,240,'Full interior cleaning using all available tools']];
const PL=[['None',0],['Plastic Care: Basic',15],['Plastic Care: Deluxe',30],['Plastic Care: Alchemist Restoration',60]];
const RB=[['None',0],['Rubber Care: Basic',15],['Alchemy Rubber Restoration',40]];
const BACKEND={url:'',key:''};            // paste your Supabase Project URL and anon public key once the site is hosted
const BIZ={phone:'',email:'',address:''}; // shown only when filled in (the shop address also comes from business settings)
const WORK=[];                            // finished-vehicle photos: [{src:'photos/a.jpg',alt:'Gray SUV after detail'}]
let BPR=null,SIZE={};
const PLC=['','plastic_basic','plastic_deluxe','plastic_restoration'],RBC=['','rubber_basic','rubber_restoration'];
const BSAVE=.9;                           // placeholder bundle discount (10%)
/* ---- helpers ---- */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=p=>p.split('.').reduce((o,k)=>o[k],S),set=(p,v)=>{const a=p.split('.'),k=a.pop();a.reduce((o,x)=>o[x],S)[k]=v};
const bp=i=>BPR?BPR[i]:Math.round((EXT[i][1]+INT[i][1])*BSAVE);
const logo=z=>LOGO_SRC?`<img src="${esc(LOGO_SRC)}" width="${z}" height="${z}" alt="Alchemist Detailing">`:`<svg width="${z}" height="${z}" viewBox="0 0 48 48" role="img" aria-label="Alchemist Detailing"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e3a1"/><stop offset="1" stop-color="#8c6a21"/></linearGradient></defs><circle cx="24" cy="24" r="21" fill="none" stroke="url(#lg)" stroke-width="2"/><text x="24" y="30" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="19" font-weight="600" fill="url(#lg)">AD</text></svg>`;
const URLRE=/(https?:|www\.|\b[\w-]+\.(com|net|org|io|co|app|me|ly|info|xyz|ru|cn|site|shop|link)\b)/i,EMO=/\p{Extended_Pictographic}/u;
const badTxt=t=>URLRE.test(t)?'Links are not allowed in this field.':EMO.test(t)?'Emojis are not allowed in this field.':'';
const tfmt=m=>{const h=Math.floor(m/60);return((h+11)%12+1)+':'+String(m%60).padStart(2,'0')+(h<12?' AM':' PM')};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const MENU=[['home','Home'],['services','Services'],['reviews','Reviews'],['tips','Tips'],['faq','FAQ'],['about','About us'],['contact','Contact'],['appointments','Appointments'],['account','Account']];
const LBL={book:'Book'};MENU.forEach(m=>LBL[m[0]]=m[1]);
/* ---- state ---- */
const S={step:0,err:{},g:{name:'',last:'',phone:'',email:''},v:{make:'',model:'',year:'',color:'',type:'',mods:[],dmg:[],dnote:'',conds:[],ns:false,desc:'',photos:[],vid:'',add:false},s:{tab:'build',ext:-1,int:-1,bun:-1,pl:0,rb:0,req:''},l:{t:'',addr:''},d:'',tm:'',done:null,hp:'',me:null,cal:null,calKey:'',calErr:'',slots:null,slotKey:'',files:[],urls:[],chg:false,busy:false,sub:'',apiFail:false};
const DK='ad_draft',dh=m=>Math.floor(m/60)+' h'+(m%60?' '+m%60+' min':'');
function saveDraft(){if(S.done)return;try{sessionStorage.setItem(DK,JSON.stringify({step:S.step,g:S.g,v:{...S.v,photos:[]},s:S.s,l:S.l,d:S.d,tm:S.tm}))}catch(e){}}
function loadDraft(){try{const d=JSON.parse(sessionStorage.getItem(DK)||'null');if(!d)return;S.step=d.step||0;Object.assign(S.g,d.g);Object.assign(S.v,d.v);Object.assign(S.s,d.s);Object.assign(S.l,d.l);S.d=d.d||'';S.tm=d.tm}catch(e){}}
/* ---- data layer: every screen reads and writes through API. Swap adapters, not screens. ---- */
const PME={first:'Alex',last:'',phone:'9455550101',email:'alex@example.com',vehicles:[{id:'p1',year:'2020',make:'Toyota',model:'Camry',vehicle_type:'Sedan'},{id:'p2',year:'2018',make:'Jeep',model:'Wrangler',vehicle_type:'SUV'}]};
function mockAdapter(){const hs=d=>(d.getDate()*7+(d.getMonth()+1)*13)%11,at=x=>new Date(x+'T00:00');
const slots=(x,min)=>{const d=at(x),o=[];if(hs(d)===0||hs(d)===6)return o;for(let m=CFG.OPEN*60;m+min<=CFG.CLOSE*60;m+=CFG.STEP)if((d.getDate()*31+m)%7!==0)o.push(m);return o};
return{mock:true,catalog:async()=>null,session:async()=>null,
calendar:async(from,n,min)=>{const o=[];for(let i=0;i<n;i++){const d=at(from);d.setDate(d.getDate()+i);const k=iso(d);o.push({day:k,available:slots(k,min).length>0})}return o},
slots:async(d,min)=>slots(d,min),upload:async f=>'preview/'+f.name,
submit:async p=>{const ref='AD-'+Math.random().toString(36).slice(2,8).toUpperCase();try{const q=JSON.parse(localStorage.getItem('ad_req')||'[]');q.push({ref,p});localStorage.setItem('ad_req',JSON.stringify(q))}catch(e){}return{ref}}}}
function sbAdapter(){const c=window.supabase.createClient(BACKEND.url,BACKEND.key),ck=r=>{if(r.error)throw r.error;return r.data};
return{mock:false,
catalog:async()=>{const[a,b,x]=await Promise.all([c.from('services').select('*').eq('active',true),c.from('vehicle_size_rules').select('*'),c.from('business_settings').select('*').single()]);const size={};ck(b).forEach(r=>size[r.vehicle_type]=+r.surcharge_pct);return{rows:ck(a),size,cfg:ck(x)}},
calendar:async(from,n,min)=>ck(await c.rpc('get_calendar',{p_from:from,p_days:n,p_duration:min})).map(r=>({day:r.day,available:r.available})),
slots:async(d,min)=>ck(await c.rpc('get_availability',{p_date:d,p_duration:min}))||[],
session:async()=>{const{data:{session}}=await c.auth.getSession();if(!session)return null;const p=ck(await c.from('profiles').select('first_name,last_name,phone,email').eq('id',session.user.id).single()),v=ck(await c.from('vehicles').select('id,make,model,year,color,vehicle_type').is('deleted_at',null));return{first:p.first_name,last:p.last_name,phone:p.phone,email:p.email,vehicles:v||[]}},
upload:async f=>{const{data:{user}}=await c.auth.getUser(),ext=((f.name.split('.').pop()||'jpg')+'').toLowerCase().replace(/[^a-z0-9]/g,''),path=user.id+'/'+crypto.randomUUID()+'.'+ext;ck(await c.storage.from('vehicle-photos').upload(path,f,{contentType:f.type}));return path},
submit:async p=>ck(await c.rpc('submit_booking',{p}))}}
const loadSb=()=>new Promise((ok,no)=>{const x=document.createElement('script');x.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';x.onload=ok;x.onerror=no;document.head.appendChild(x)});
let API=BACKEND.url&&BACKEND.key?null:mockAdapter();
function applyCatalog(cat){const by=k=>cat.rows.filter(r=>r.kind===k).sort((a,b)=>a.sort-b.sort),nm=r=>r.name.replace(/^(Exterior|Interior) /,'');
EXT.length=0;by('exterior').forEach(r=>EXT.push([nm(r),r.price_cents/100,r.duration_min,r.description]));INT.length=0;by('interior').forEach(r=>INT.push([nm(r),r.price_cents/100,r.duration_min,r.description]));
